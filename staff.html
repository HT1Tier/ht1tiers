        <h1>Тир-лист Minecraft PvP игроков - Рейтинг и таблица лидеров</h1>
        <p>ATiers - тир-лист и рейтинг Minecraft PvP игроков. Таблица лидеров по режимам Mace, Axe, UHC, Sword, SMP, NPOT. Узнай свой тир от LT5 до HT1 и сравни навыки с другими игроками.</p>

        <h2>Режимы PvP</h2>
        <p>Тирование доступно по всем популярным режимам Minecraft PvP: Mace PvP, Axe PvP, UHC, Sword PvP, SMP, NPOT, DSMP, Creeper, OP, Shield. Для каждого режима - отдельная таблица лидеров и тир-лист.</p>

        <h2>Система тиров</h2>
        <p>Игроки распределяются по тирам от LT5 (начальный) до HT1 (высший уровень мастерства). Порядок тиров: LT5, HT5, LT4, HT4, LT3, HT3, LT2, HT2, LT1, HT1.</p>

        <h2>Как попасть в тирлист?</h2>
        <p>Чтобы попасть в тирлист, нужно пройти тиртест - специальное испытание, где ваши навыки PvP оценивают тиртестеры. <a href="queue.html">Встаньте в очередь</a> на сайте и ожидайте своей очереди. Подробнее в <a href="guide.html">гайде по тир-тестам</a>.</p>
